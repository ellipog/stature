plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // No mappings block: 26.x is unobfuscated (official Mojang names are the names), and Loom
    // refuses layered mappings in a non-obfuscated environment. Parchment publishes nothing
    // for 26.x either, so there is nothing to layer.
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // :api is on the compile classpath here, and its classes ride inside this jar (see
    // multiloader-loader.gradle): a profile needs this one jar, not a second api jar.
    implementation project(':api')
}

loom {
    // No `mixin` block: Loom 1.17 disabled the mixin annotation processor by default and says to
    // remove the configuration. Nothing is lost on 26.x, which is unobfuscated: spike-s2/ proved
    // mixins apply with no refmap at all, because there are no obfuscated names to map back.
    // If a refmap is ever genuinely needed, that is `useLegacyMixinAp = true`, not this block.
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// ---------------------------------------------------------------------------
// Gametests (improvement plan M4).
//
// This creates the `gametest` source set (src/gametest/) and the `gameTest`
// and `clientGameTest` run configs, run with `:fabric:runGameTest` and
// `:fabric:runClientGameTest` (run dirs build/run/gameTest and
// build/run/clientGameTest). The test bodies live in :common and are shared
// with NeoForge; the source set only registers them.
//
// eula = true: Elliot has accepted the Minecraft EULA for these run dirs
// (plan Q14). The server suite runs headless; the client suite needs a
// display (xvfb-run on CI, a logged-in session locally) and takes
// screenshots instead of asserting pixels.
//
// src/gametest/resources/fabric.mod.json carries literal versions, not
// ${...} placeholders: Loom creates a separate processGametestResources
// task that the main expansion block does not touch, so placeholders would
// arrive verbatim and fail loader parsing. Bump the literals with the
// gradle.properties versions.
// ---------------------------------------------------------------------------
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'stature-gametest'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

// Loom 1.17.21's acceptGameTestEula task writes the clientGameTest run directory, not the
// headless gameTest one, so the server run starts with no eula.txt and writes a default
// eula=false (and logs "Failed to load eula.txt"). Q14 approved acceptance, so write the
// file the gameTest server actually reads; GameTestServer does not check it, this only
// keeps the run directory consistent with the approved setting and the log quiet.
tasks.configureEach {
    if (name == 'runGameTest') {
        doFirst {
            def eula = file('build/run/gameTest/eula.txt')
            eula.parentFile.mkdirs()
            eula.text = 'eula=true\n'
        }
    }
}
