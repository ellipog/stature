# Push and pull-request CI for Stature.
#
# The same `build` the local loop runs: the game-free JUnit suite in :api and :common, and the
# Fabric server gametests Loom wires into `check`. The NeoForge gametest is a run task rather than
# a test task, so it stays a separate command (TESTING.md) instead of being hidden in here.
#
# No release or publish workflow: a release is a decision, not a side effect of a commit.
name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A test JVM that keeps a server thread alive would otherwise run to GitHub's 6-hour cap.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # `build` includes `check` includes `test`, so a failing unit test or Fabric gametest stops
      # the build. --stacktrace is for the failure that happens inside a plugin, where the useful
      # line is a few frames below the one Gradle prints by default.
      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      # JUnit's HTML and XML, plus Gradle's problems report, are the things worth opening after a
      # failure; the run's own console log is already kept by GitHub.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/problems/**
          if-no-files-found: ignore
