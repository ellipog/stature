plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // No access-transformer block: 26.3 needs no widening.
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        // Gametests (improvement plan M4): headless server run, executed as
        // `:neoforge:runGameTestServer`. Only this run sets
        // stature.gametest, so only it registers the shared bodies in
        // NeoForgeStatureGameTests; every other run (and the shipped jar)
        // never sees them. enabledGameTestNamespaces comes from the
        // configureEach above. EULA acceptance for gametest runs is
        // approved (plan Q14); if this run ever asks for it, the agreement
        // belongs in its run dir, never in a committed file.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'stature.gametest', 'true'
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// No datagen run: Stature ships no generated resources, and the M5 damage-type JSON is
// hand-written data rather than output.

dependencies {
    // :api is on the compile classpath here, and its classes ride inside this jar (see
    // multiloader-loader.gradle): a profile needs this one jar, not a second api jar.
    implementation project(':api')

    // Armature's common API -- see the note in :fabric. Stature names nothing from Armature's
    // NeoForge jar, and that jar is loaded as a separate mod at runtime.
    compileOnly "dev.ellipog:armature-common-${minecraft_version}:${armature_version}"

    // And for the dev runs, which need the mod itself or the loader refuses to start.
    runtimeOnly "dev.ellipog:armature-neoforge-${minecraft_version}:${armature_version}"
}
