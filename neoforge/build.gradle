plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // No access-transformer block: 26.3 needs no widening.
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        // Gametests (improvement plan M4): headless server run, executed as
        // `:neoforge:runGameTestServer`. Only this run sets
        // stature.gametest, so only it registers the shared bodies in
        // NeoForgeStatureGameTests; every other run (and the shipped jar)
        // never sees them. enabledGameTestNamespaces comes from the
        // configureEach above. EULA acceptance for gametest runs is
        // approved (plan Q14); if this run ever asks for it, the agreement
        // belongs in its run dir, never in a committed file.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'stature.gametest', 'true'
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // :api is on the compile classpath here, and its classes ride inside this jar (see
    // multiloader-loader.gradle): a profile needs this one jar, not a second api jar.
    implementation project(':api')
}
