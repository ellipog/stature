modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/ellipog/stature/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
iconFile = "assets/stature/icon.png"
displayURL = "https://ellipog.dev/docs/stature/"
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

# Armature is required, not optional. NeoForge refuses to load Stature without it and says so
# by name, which is the failure we want: the alternative is a NoClassDefFoundError naming a
# class the player has never heard of.
[[dependencies.${mod_id}]]
modId = "armature"
type = "required"
versionRange = "[${armature_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "stature.mixins.json"
