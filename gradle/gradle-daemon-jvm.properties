# Gradle's daemon JVM criteria (Gradle 8.8+). The wrapper may be launched by any Java, but the
# daemon that runs Loom must be 25: Loom's 26.x metadata requires it, and the 26.x mapping
# pipeline needs it. Gradle finds an installed JDK 25 through its normal toolchain detection
# (JAVA_HOME, the usual install roots, and ~/.gradle/jdks), so no machine path is committed.
toolchainVersion=25
