# Important Notes:
# Every field you add must be added to the expandProps map in
# buildSrc/src/main/groovy/multiloader-common.gradle.

# Project. 0.1.0 is a starting number for a repo with no releases, not a claim: say the word
# and it becomes whatever it should be.
version=0.1.0
group=dev.ellipog
java_version=25

# Common
minecraft_version=26.3
mod_name=Stature
mod_author=ellipog
mod_id=stature
license=MIT
credits=Docs: https://ellipog.dev/docs/stature/
description=Scale and anatomy API for Fabric and NeoForge.
minecraft_version_range=[26.3, 26.4)
# The same range in Fabric's Maven dependency syntax, for fabric.mod.json. Kept beside the
# NeoForge form so the two cannot drift.
minecraft_version_range_fabric=>=26.3 <26.4
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1
# 26.x is unobfuscated with official Mojang names, so there is no Parchment for it: Loom uses
# officialMojangMappings() alone and the ModDevGradle parchment blocks are gone (see the loader
# build files). These two lines stay deleted; do not re-add them.
# parchment_minecraft= (none on 26.x)
# parchment_version= (none on 26.x)

# Fabric
fabric_version=0.162.0+26.3
fabric_loader_version=0.19.5
# Minimum versions fabric.mod.json accepts, kept separate from the dev versions above so that
# bumping a dev build does not silently raise a player's minimum (M8).
fabric_loader_min_version=0.19.5
fabric_api_min_version=0.162.0+26.3

# Armature
## The version Stature compiles against and declares as a required dependency. Published by
## ../armature to Maven local during development and to https://maven.ellipog.dev by its release
## workflow. Armature has to be published before this repo can compile; the error otherwise names
## a class that is right there in the file you just edited. See the repositories in
## buildSrc/src/main/groovy/multiloader-common.gradle.
armature_version=1.1.0

# Tests. JUnit 5, via the BOM so the platform and jupiter versions cannot drift apart.
#
# Deliberately the same number as armature/ and tenet/, and deliberately a property rather than a
# literal in each module's build file: the three repos' tests should not be able to disagree about
# which JUnit they run.
junit_version=5.10.2

# NeoForge
neoforge_version=26.3.0.76
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Loom for 26.x resolves only on a 25+ JVM (its own metadata says so), and the 26.x mapping
# pipeline needs one to run. That is declared as Gradle's daemon JVM criteria in
# gradle/gradle-daemon-jvm.properties, not as a path here: a committed path only works on one
# machine, and CI reads this file too.

# Local test profiles (Modrinth App). deployFabric / deployNeoForge copy the built jars into
# testModsDirFabric / testModsDirNeoForge, deleting the previous ones first. Those are paths on
# one machine, so they live in local.properties (gitignored) or come from a -P property, never
# from this file.
