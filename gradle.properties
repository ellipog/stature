# Important Notes:
# Every field you add must be added to the expandProps map in
# buildSrc/src/main/groovy/multiloader-common.gradle.

# Project. 0.1.0 is a starting number for a repo with no releases, not a claim: say the word
# and it becomes whatever it should be.
version=0.1.0
group=dev.ellipog
java_version=25

# Common
minecraft_version=26.3
mod_name=Stature
mod_author=ellipog
mod_id=stature
license=MIT
credits=Docs: https://ellipog.dev/docs/stature/
description=Scale and anatomy API for Fabric and NeoForge.
minecraft_version_range=[26.3, 26.4)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1
# 26.x is unobfuscated with official Mojang names, so there is no Parchment for it: Loom uses
# officialMojangMappings() alone and the ModDevGradle parchment blocks are gone (see the loader
# build files). These two lines stay deleted; do not re-add them.
# parchment_minecraft= (none on 26.x)
# parchment_version= (none on 26.x)

# Fabric
fabric_version=0.162.0+26.3
fabric_loader_version=0.19.5

# Tests. JUnit 5, via the BOM so the platform and jupiter versions cannot drift apart.
#
# Deliberately the same number as armature/ and tenet/, and deliberately a property rather than a
# literal in each module's build file: the three repos' tests should not be able to disagree about
# which JUnit they run.
junit_version=5.10.2

# NeoForge
neoforge_version=26.3.0.76
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Loom for 26.x resolves only on a 25+ JVM (its own metadata says so), and the 26.x mapping
# pipeline needs one to run -- so this branch pins its daemon here. Same arrangement as
# testModsDir* below: a path on this machine, committed, because a CI runner never reads it
# (the release workflow sets up JDK 25 itself).
org.gradle.java.home=C:/Users/Ellio/Java/jdk-25

# Local test profiles (Modrinth App). deployFabric / deployNeoForge copy
# the built jars here, deleting the previous ones first.
testModsDirFabric=C:/Users/Ellio/AppData/Roaming/ModrinthApp/profiles/Fabric 26.3/mods
testModsDirNeoForge=C:/Users/Ellio/AppData/Roaming/ModrinthApp/profiles/NeoForge 26.3/mods
